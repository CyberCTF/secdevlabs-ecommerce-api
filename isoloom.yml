# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Vulnerable eCommerce API (secDevLabs, by Globo.com) as an Isoloom spec: a Go API with a Broken
# Access Control flaw (tickets fetched by user id, no ownership check), vendored unchanged in
# build/api/app/ (the app folder owasp-top10-2021-apps/a1/ecommerce-api of secDevLabs), built by
# an overlay of upstream's Dockerfile, and its MongoDB machine.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: secdevlabs-ecommerce-api

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.91.0/24, internet: false}

machines:
  mongodb:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {data: /data/db}
    ports:
      mongodb:
        port: 27017
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/mongodb

  api:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [mongodb]
    ports:
      api:
        port: 10005
        protocol: http
        publish: true
    app:
      build: build/api
checks:
  - name: the store answers
    http: http://api:10005/
    wait: 180
  - name: the API health check answers
    http: http://api:10005/healthcheck
  - name: the ticket route answers without a session
    script: checks/ticket.sh
    wait: 60

message: |
  Vulnerable eCommerce API answers at {{ machines.api.ports.api.url }}.
  Register two users, log in, and compare how each one fetches its ticket.
