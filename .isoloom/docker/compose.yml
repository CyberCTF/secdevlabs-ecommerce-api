# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: secdevlabs-ecommerce-api
services:
  mongodb:
    build:
      context: ../../build/mongodb
      labels:
        isoloom.managed: 'true'
        isoloom.environment: secdevlabs-ecommerce-api
    image: isoloom/secdevlabs-ecommerce-api-mongodb
    platform: linux/amd64
    hostname: mongodb
    networks:
      lab:
        ipv4_address: 10.60.91.20
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
    volumes:
    - mongodb-data:/data/db
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 27017
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.mongodb: tcp:27017
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-ecommerce-api
    restart: unless-stopped
  mongodb-routes:
    image: alpine:3.20
    network_mode: service:mongodb
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      mongodb:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-ecommerce-api
  mongodb-init-1:
    image: isoloom/secdevlabs-ecommerce-api-mongodb
    entrypoint:
    - /bin/sh
    - /isoloom/init/flag.sh
    volumes:
    - ../../ctf/flag.sh:/isoloom/init/flag.sh:ro
    - mongodb-data:/data/db
    network_mode: service:mongodb
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-routes:
        condition: service_healthy
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-ecommerce-api
  api:
    build:
      context: ../../build/api
      labels:
        isoloom.managed: 'true'
        isoloom.environment: secdevlabs-ecommerce-api
    image: isoloom/secdevlabs-ecommerce-api-api
    platform: linux/amd64
    hostname: api
    networks:
      lab:
        ipv4_address: 10.60.91.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+10005}:10005
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 10005
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      mongodb-init-1:
        condition: service_completed_successfully
      mongodb-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.api: http:10005
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-ecommerce-api
    restart: unless-stopped
  api-routes:
    image: alpine:3.20
    network_mode: service:api
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-ecommerce-api
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    user: '0'
    cap_add:
    - NET_ADMIN
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init-1:
        condition: service_completed_successfully
      mongodb-routes:
        condition: service_healthy
      api:
        condition: service_healthy
      api-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-ecommerce-api
  isoloom-check-mongodb:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/mongodb.sh:/isoloom/run.sh:ro
    network_mode: service:mongodb
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init-1:
        condition: service_completed_successfully
      mongodb-routes:
        condition: service_healthy
      api:
        condition: service_healthy
      api-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-ecommerce-api
  isoloom-check-api:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/api.sh:/isoloom/run.sh:ro
    network_mode: service:api
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init-1:
        condition: service_completed_successfully
      mongodb-routes:
        condition: service_healthy
      api:
        condition: service_healthy
      api-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-ecommerce-api
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-ecommerce-api
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.91.0/24
        gateway: 10.60.91.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-ecommerce-api
volumes:
  mongodb-data:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-ecommerce-api
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-ecommerce-api
